<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekapitulasi Hasil Panen — Prime Agri</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .table-excel {
      border-collapse: collapse;
      width: 100%;
      border: 2px solid #000;
    }
    .table-excel th, .table-excel td {
      border: 1px solid #000;
      padding: 4px 8px;
    }
    .table-excel th {
      background-color: #f3f4f6;
      font-weight: bold;
      text-align: center;
    }
    .excel-header-outer {
      border-bottom: 3px double #000;
    }
  </style>
</head>
<body class="bg-gray-100 font-sans text-gray-900 p-4 md:p-8">

  <div class="max-w-7xl mx-auto bg-white p-4 md:p-8 shadow-lg rounded-lg">
    
    <!-- FORM INPUT RINGKAS -->
    <div class="mb-8 p-4 bg-gray-50 border border-gray-200 rounded-lg">
      <h2 class="font-bold text-gray-800 mb-3 text-lg">Tambah Data Panen (Cepat)</h2>
      <form id="form-produksi" onsubmit="tambahBaris(event)" class="grid grid-cols-2 md:grid-cols-4 lg:grid-cols-6 gap-3">
        
        <!-- Tanggal -->
        <div class="col-span-1 md:col-span-1">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Tanggal</label>
          <input type="date" id="in-tanggal" class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:border-emerald-500">
        </div>

        <!-- Pusingan (1-5) -->
        <div class="col-span-1">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Pusingan</label>
          <select id="in-pusingan" class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:border-emerald-500 bg-white">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
          </select>
        </div>

        <!-- Kelompok (37-48) -->
        <div class="col-span-1">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Kelompok</label>
          <select id="in-kelompok" onchange="updatePengurus()" class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:border-emerald-500 bg-white">
            <option value="">- Pilih -</option>
            <script>
              for(let i=37; i<=48; i++) document.write(`<option value="${i}">${i}</option>`);
            </script>
          </select>
        </div>

        <!-- Pengurus (Otomatis) -->
        <div class="col-span-1">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Pengurus</label>
          <input type="text" id="in-pengurus" class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:border-emerald-500 bg-gray-100" readonly placeholder="Otomatis">
        </div>

        <!-- No Kavling (Otomatis) -->
        <div class="col-span-1">
          <label class="block text-xs font-semibold text-gray-600 mb-1">No Kavling</label>
          <input type="text" id="in-kavling" class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:border-emerald-500 bg-gray-100" readonly placeholder="Mengikuti Klp">
        </div>

        <!-- Nama Pemanen -->
        <div class="col-span-1">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Nama</label>
          <input type="text" id="in-nama" class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:border-emerald-500">
        </div>

        <!-- Absen -->
        <div class="col-span-1">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Absen</label>
          <input type="number" id="in-absen" class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:border-emerald-500" placeholder="0">
        </div>

        <!-- Berondolan -->
        <div class="col-span-1">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Berondolan</label>
          <input type="number" id="in-berondolan" class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:border-emerald-500" placeholder="0">
        </div>

        <!-- Buah Masak -->
        <div class="col-span-1">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Masak</label>
          <input type="number" id="in-masak" class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:border-emerald-500" placeholder="0">
        </div>

        <!-- Buah Mengkal -->
        <div class="col-span-1">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Mengkal</label>
          <input type="number" id="in-mengkal" class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:border-emerald-500" placeholder="0">
        </div>

        <!-- Buah Mentah -->
        <div class="col-span-1">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Mentah</label>
          <input type="number" id="in-mentah" class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:border-emerald-500" placeholder="0">
        </div>

        <!-- Buah Busuk -->
        <div class="col-span-1">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Busuk</label>
          <input type="number" id="in-busuk" class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:border-emerald-500" placeholder="0">
        </div>

        <!-- Harga -->
        <div class="col-span-1">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Harga</label>
          <input type="number" id="in-harga" class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:border-emerald-500" placeholder="0">
        </div>

        <!-- Jumlah -->
        <div class="col-span-1">
          <label class="block text-xs font-semibold text-gray-600 mb-1">Jumlah</label>
          <input type="number" id="in-jumlah" class="w-full border border-gray-300 rounded px-2 py-1 text-sm focus:border-emerald-500" placeholder="0">
        </div>

        <!-- Tombol Simpan -->
        <div class="col-span-2 md:col-span-6 lg:col-span-6 flex justify-end mt-2">
          <button type="submit" class="bg-emerald-700 hover:bg-emerald-800 text-white font-semibold text-sm px-8 py-2 rounded shadow transition w-full md:w-auto">
            + Tambah ke Tabel
          </button>
        </div>

      </form>
    </div>

    <!-- TABEL REKAPITULASI -->
    <div class="overflow-x-auto">
      <table class="table-excel text-xs md:text-sm">
        <thead>
          <tr>
            <th colspan="15" class="text-lg md:text-xl py-2 bg-white">REKAPITULASI HASIL</th>
          </tr>
        </thead>
        <tbody>
          <tr class="bg-white">
            <td colspan="6" class="font-bold border-r-0">KEBUN : <span id="p-kebun">-</span></td>
            <td colspan="9" class="font-bold border-l-0">NO KLP : <span id="p-noklp">-</span></td>
          </tr>
          <tr class="bg-white">
            <td colspan="6" class="border-r-0">TANGGAL: <span id="p-tanggal">-</span></td>
            <td colspan="9" class="border-l-0">NAMA PENGURUS : <span id="p-pengurus">-</span></td>
          </tr>
          <tr class="bg-white excel-header-outer">
            <td colspan="15" class="border-b-2">PANEN PUSINGAN : <span id="p-pusingan">-</span></td>
          </tr>

          <!-- Header Tabel -->
          <tr class="bg-gray-100">
            <th class="border-b-2">TANGGAL</th>
            <th class="border-b-2">PUSINGAN</th>
            <th class="border-b-2">KLP</th>
            <th class="border-b-2">PENGURUS</th>
            <th class="border-b-2 bg-yellow-50">KAVLING</th>
            <th class="border-b-2">NAMA</th>
            <th class="border-b-2">ABSEN</th>
            <th class="border-b-2">BERONDOLAN</th>
            <th class="border-b-2">MASAK</th>
            <th class="border-b-2">MENGKAL</th>
            <th class="border-b-2">MENTAH</th>
            <th class="border-b-2">BUSUK</th>
            <th class="border-b-2">HARGA</th>
            <th class="border-b-2">JUMLAH</th>
            <th class="border-b-2">AKSI</th>
          </tr>

          <!-- Body Tabel -->
          <tbody id="p-tbody"></tbody>

          <!-- Footer Total -->
          <tr class="bg-gray-100 font-bold">
            <td colspan="13" class="text-right border-r-0">TOTAL JUMLAH</td>
            <td id="p-total-jumlah" class="text-right border-l-0 text-lg">0</td>
            <td class="border-l-0 bg-gray-100"></td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src="js/produksi.js"></script>
</body>
</html>
