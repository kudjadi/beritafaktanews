<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />
  <title>Form Panen Sawit</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Optimasi Tampilan Mobile */
    @media (max-width: 640px) {
      .mobile-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      .mobile-input { font-size: 16px !important; padding: 10px !important; }
      .mobile-btn { padding: 12px !important; font-size: 14px !important; }
      .mobile-table { font-size: 11px; }
      .mobile-table td, .mobile-table th { padding: 4px 2px !important; }
    }
    
    button, input, select { min-height: 42px; }
    .scrollable-table { -webkit-overflow-scrolling: touch; scrollbar-width: thin; }

    /* Menyembunyikan kolom kurang penting di HP agar tabel compact */
    @media (max-width: 768px) {
      .col-hide-md { display: none; }
    }
    @media (max-width: 480px) {
      .col-hide-sm { display: none; }
    }
  </style>
</head>
<body class="bg-gray-100 p-2 md:p-4 text-sm">

<div class="max-w-full mx-auto bg-white rounded-xl shadow-lg p-3 md:p-6">
  <!-- Header -->
  <div class="text-center mb-4 md:mb-6">
    <h1 class="text-xl md:text-2xl font-bold text-green-800 mb-1">Form Panen Sawit</h1>
    <p class="text-xs text-gray-500">Input data panen harian</p>
  </div>

  <!-- Form Input -->
  <div class="space-y-3 mb-6">
    
    <!-- Pilih Kelompok -->
    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1">Kelompok Tani</label>
      <select id="dropdown_kelompok" class="w-full border border-gray-300 rounded-lg focus:ring-1 focus:ring-green-500 mobile-input" onchange="updateDataKelompok()">
        <option value="">-- Pilih Kelompok --</option>
      </select>
    </div>
    
    <!-- Tanggal & Nama -->
    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Tanggal</label>
        <input id="tanggal" type="date" class="w-full border border-gray-300 rounded-lg focus:ring-1 focus:ring-green-500 mobile-input">
      </div>
      <div>
        <label class="block text-xs font-bold text-gray-700 mb-1">Nama Pemanen</label>
        <input id="nama" placeholder="Nama" class="w-full border border-gray-300 rounded-lg focus:ring-1 focus:ring-green-500 mobile-input">
      </div>
    </div>
    
    <!-- Pilih Kavling -->
    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1">No Kavling</label>
      <select id="dropdown_kavling" class="w-full border border-gray-300 rounded-lg focus:ring-1 focus:ring-green-500 mobile-input">
        <option value="">-- Pilih Kavling --</option>
      </select>
      <input id="kavling_manual" placeholder="Atau ketik kavling manual..." class="w-full border border-gray-300 rounded-lg mt-2 focus:ring-1 focus:ring-green-500 mobile-input">
    </div>
    
    <!-- Tandan & Berondolan -->
    <div>
      <label class="block text-xs font-bold text-gray-700 mb-1">Jenis Tandan</label>
      <div class="grid grid-cols-2 md:grid-cols-4 gap-2">
        <div>
          <input id="tandan_matang" type="number" placeholder="Matang" min="0" class="w-full border border-gray-300 rounded-lg focus:ring-1 focus:ring-green-500 mobile-input">
        </div>
        <div>
          <input id="tandan_mentah" type="number" placeholder="Mentah" min="0" class="w-full border border-gray-300 rounded-lg focus:ring-1 focus:ring-green-500 mobile-input">
        </div>
        <div>
          <input id="tandan_busuk" type="number" placeholder="Busuk" min="0" class="w-full border border-gray-300 rounded-lg focus:ring-1 focus:ring-green-500 mobile-input">
        </div>
        <div>
          <input id="jangkos" type="number" placeholder="Jangkos" min="0" class="w-full border border-gray-300 rounded-lg focus:ring-1 focus:ring-green-500 mobile-input">
        </div>
      </div>
      <input id="berondolan" type="number" placeholder="Berondolan (Kg)" min="0" step="0.1" class="w-full border border-gray-300 rounded-lg mt-2 focus:ring-1 focus:ring-green-500 mobile-input">
    </div>
  </div>

  <!-- Tombol Tambah -->
  <button onclick="tambahData()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-lg shadow transition mb-2 mobile-btn">
    + Tambah ke Tabel
  </button>
  <p id="statusForm" class="text-center text-xs text-green-600 font-medium mb-6 h-4"></p>

  <!-- Tabel Data Compact -->
  <div class="mb-6 border border-gray-200 rounded-lg overflow-hidden">
    <div class="flex justify-between items-center bg-gray-50 p-2 border-b border-gray-200">
      <h2 class="text-sm font-bold text-gray-800">Data Panen</h2>
      <span id="totalData" class="bg-green-100 text-green-800 text-xs font-bold px-2 py-0.5 rounded">0 data</span>
    </div>
    
    <div class="mobile-scroll">
      <table id="tabelData" class="w-full text-left border-collapse mobile-table">
        <thead class="bg-gray-100 text-gray-600 text-xs uppercase">
          <tr>
            <th class="p-2 border-b">No</th>
            <th class="p-2 border-b col-hide-sm">Kelompok</th>
            <th class="p-2 border-b col-hide-md">Tanggal</th>
            <th class="p-2 border-b">Nama</th>
            <th class="p-2 border-b bg-green-50">Kavling</th>
            <th class="p-2 border-b text-center">Mtg</th>
            <th class="p-2 border-b text-center col-hide-sm">Mnt</th>
            <th class="p-2 border-b text-center">Bsk</th>
            <th class="p-2 border-b text-center col-hide-sm">Jkg</th>
            <th class="p-2 border-b text-center">Brdln</th>
            <th class="p-2 border-b text-center">Hapus</th>
          </tr>
        </thead>
        <tbody id="tabelBody" class="text-xs text-gray-700 divide-y divide-gray-200">
          <!-- Data dirender oleh JS -->
        </tbody>
      </table>
    </div>
  </div>

  <!-- Total Ringkasan -->
  <div class="bg-gray-50 p-3 rounded-lg border border-gray-200 text-xs mb-6">
    <div class="grid grid-cols-4 gap-2 text-center">
      <div><div class="text-gray-500">Matang</div><div id="totalMatangMobile" class="font-bold text-sm">0</div></div>
      <div><div class="text-gray-500">Mentah</div><div id="totalMentahMobile" class="font-bold text-sm">0</div></div>
      <div><div class="text-gray-500">Busuk</div><div id="totalBusukMobile" class="font-bold text-sm">0</div></div>
      <div><div class="text-gray-500">Berondolan</div><div id="totalBrdlnMobile" class="font-bold text-sm">0</div></div>
    </div>
  </div>

  <!-- Tombol Ekspor & Reset -->
  <div class="grid grid-cols-3 gap-2 mb-6">
    <button onclick="exportJSON()" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 rounded text-xs shadow">📥 JSON</button>
    <button onclick="syncToGitHub()" class="bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded text-xs shadow">📤 GitHub</button>
    <button onclick="resetForm()" class="bg-gray-600 hover:bg-gray-700 text-white font-semibold py-2 rounded text-xs shadow">🔄 Reset</button>
  </div>
  <p id="statusAksi" class="text-center text-xs text-blue-600 font-medium mb-6 h-4"></p>

  <!-- Konfigurasi GitHub -->
  <details class="bg-gray-50 border border-gray-200 rounded-lg mb-4">
    <summary class="p-3 font-bold text-xs text-gray-700 cursor-pointer">⚙️ Pengaturan GitHub</summary>
    <div class="p-3 border-t border-gray-200 space-y-2">
      <input id="githubUsername" placeholder="Username GitHub" class="w-full border p-2 rounded text-xs">
      <input id="githubRepo" placeholder="Nama Repo" value="data-panen-sawit" class="w-full border p-2 rounded text-xs">
      <input id="githubToken" type="password" placeholder="Token (ghp_...)" class="w-full border p-2 rounded text-xs">
      <button onclick="saveGitHubConfig()" class="w-full bg-blue-500 text-white p-2 rounded text-xs font-bold">Simpan Konfigurasi</button>
      <p id="githubStatus" class="text-center text-xs mt-2 h-4"></p>
      <div class="grid grid-cols-2 gap-2 mt-2">
        <button onclick="syncFromGitHub()" class="bg-yellow-500 text-white p-2 rounded text-xs font-bold">📥 Download</button>
        <button onclick="createGitHubRepo()" class="bg-purple-600 text-white p-2 rounded text-xs font-bold">➕ Buat Repo</button>
      </div>
    </div>
  </details>

</div>

<script src="produksi.js"></script>
</body>
</html>
